<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>2. BMI Kalkulyatori</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #e8f5e9; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>BMI Aniqlovchi</h3>
        <input type="number" id="weight" placeholder="Vazn (kg)">
        <input type="number" id="height" placeholder="Bo'y (cm)">
        <button onclick="calcBMI()">Hisoblash</button>
        <div id="res" style="margin-top:15px; font-weight:bold;"></div>
    </div>
    <script>
        function calcBMI() {
            const w = document.getElementById('weight').value;
            const h = document.getElementById('height').value / 100;
            if(w && h) {
                const bmi = (w / (h * h)).toFixed(1);
                document.getElementById('res').innerText = "BMI Indeksingiz: " + bmi;
            }
        }
    </script>
</body>
</html>
